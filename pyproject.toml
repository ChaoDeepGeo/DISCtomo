[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disctomo"
version = "0.1.1"
description = "A Python package for DISC-based seismic tomography and ray tracing"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

authors = [
    {name = "ChaoDeepGeo"}
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyseistr",
    "pyekfmm",
    "gstools"
]

[project.urls]
Homepage = "https://github.com/ChaoDeepGeo/DISCtomo"
Repository = "https://github.com/ChaoDeepGeo/DISCtomo"
Issues = "https://github.com/ChaoDeepGeo/DISCtomo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["disc*"]
exclude = ["notebook*", "Figure*"]
